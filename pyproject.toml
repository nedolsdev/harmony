[project]
name = "harmony-game-engine"
version = "0.1.0"
description = "A simple game engine framework for pygame."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Ned Olsen" }
]
dependencies = [
    "numpy>=2.3.2",
    "pygame-ce>=2.5.6",
    "rich>=14.2.0",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["FIX002", "TD002", "D203", "D213"]

[tool.ruff]
line-length = 120

[lint.isort]
required-imports = ["from __future__ import annotations"]

[dependency-groups]
dev = []

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "harmony"
module-root = ""